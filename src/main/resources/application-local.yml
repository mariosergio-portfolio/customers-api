spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=customer_app
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

aws:
  bedrock:
    # AI21 Jamba 1.5 Mini. The default in application.yml is unchanged; AWS_BEDROCK_MODEL_ID overrides this.
    model-id: ${AWS_BEDROCK_MODEL_ID:ai21.jamba-1-5-mini-v1:0}
