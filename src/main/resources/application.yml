spring:
  application:
    name: customers-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8082

logging:
  level:
    root: DEBUG
    com.planet: DEBUG

aws:
  polly:
    region: ${AWS_REGION:us-east-1}
    voice-id: ${AWS_POLLY_VOICE_ID:Joanna}
    # Leave blank in production — IAM role / env-var credentials chain is used instead.
    # Set only for local development when no AWS profile is configured.
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
