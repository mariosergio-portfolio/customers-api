server:
  port: 8082
  servlet:
    context-path: /customers # must be same of cloudFormation variable $AppServiceName (used by ALB rule)

spring:
  application:
    name: customers-api
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: customer_app

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: customer_app
    # This tells Flyway: on a non-empty schema with no history table, just record a baseline at version 0 instead of erroring out,
    # then apply every migration with a version above that — which is both V1
    # only required if you have an existing schema with no flyway history table,
    #  eg: if you are migrating an existing database to use flyway for the first time.
    #      or if you do not specifically want to start with a baseline version of 1, but rather 0.
    #baseline-on-migrate: true
    #baseline-version: 0


#  http://localhost:8082/customers/actuator/health (yml context-path)
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers, mappings
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    build:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: DEBUG
    com.mycompany: DEBUG

aws:
  polly:
    region: ${AWS_REGION:us-east-1}
    voice-id: ${AWS_POLLY_VOICE_ID:Joanna}
    # Leave blank in production — IAM role / env-var credentials chain is used instead.
    # Set only for local development when no AWS profile is configured.

   # not required if logged with: aws login command
   # access-key: ${AWS_ACCESS_KEY_ID:}
   # secret-key: ${AWS_SECRET_ACCESS_KEY:}
