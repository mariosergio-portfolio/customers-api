server:
  port: 8082
  servlet:
    context-path: /customers # must be same of cloudFormation variable $AppServiceName (used by ALB rule)

spring:
  application:
    name: customers-api
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: customer_app # also used by the SQL that /companies/{companyId}/ask runs

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: customer_app
    # This tells Flyway: on a non-empty schema with no history table, just record a baseline at version 0 instead of erroring out,
    # then apply every migration with a version above that — which is both V1
    # only required if you have an existing schema with no flyway history table,
    #  eg: if you are migrating an existing database to use flyway for the first time.
    #      or if you do not specifically want to start with a baseline version of 1, but rather 0.
    #baseline-on-migrate: true
    #baseline-version: 0


#  http://localhost:8082/customers/actuator/health (yml context-path)
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers, mappings
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    build:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: DEBUG
    com.mycompany: DEBUG

aws:
  polly:
    region: ${AWS_REGION:us-east-1}
    voice-id: ${AWS_POLLY_VOICE_ID:Joanna}
    # Leave blank in production — IAM role / env-var credentials chain is used instead.
    # Set only for local development when no AWS profile is configured.

   # not required if logged with: aws login command
   # access-key: ${AWS_ACCESS_KEY_ID:}
   # secret-key: ${AWS_SECRET_ACCESS_KEY:}

  ses:
    region: ${AWS_SES_REGION:${AWS_REGION:us-east-1}}
    # Verified SES sender. Empty = emails can be drafted but not sent (approving a batch answers 503).
    from-address: ${AWS_SES_FROM_ADDRESS:}

  bedrock:
    region: ${AWS_BEDROCK_REGION:${AWS_REGION:us-east-1}}
    # Must be a model (or cross-region inference profile) enabled in your account/region.
    #model-id: ${AWS_BEDROCK_MODEL_ID:ai21.jamba-1-5-mini-v1:0}
    # model-id: ${AWS_BEDROCK_MODEL_ID:us.anthropic.claude-sonnet-4-5-20250929-v1:0}
    model-id: ${AWS_BEDROCK_MODEL_ID:amazon.nova-pro-v1:0}


    max-tokens: ${AWS_BEDROCK_MAX_TOKENS:1024}
    # /companies/{companyId}/ask: the model generates SQL, the service runs it read-only.
    company-query-max-rows: ${AWS_BEDROCK_COMPANY_QUERY_MAX_ROWS:100}
    company-query-timeout-seconds: ${AWS_BEDROCK_COMPANY_QUERY_TIMEOUT_SECONDS:5}
    # /companies/{companyId}/agentic-ask: a tool-use agent (needs a model that supports tool use in Converse, e.g. Claude).

    # It runs queries with the same row cap and timeout as above and sees the full rows they return.
    #assistant-model-id: ${AWS_BEDROCK_ASSISTANT_MODEL_ID:us.anthropic.claude-sonnet-4-5-20250929-v1:0}
    assistant-model-id: ${AWS_BEDROCK_ASSISTANT_MODEL_ID:amazon.nova-pro-v1:0}

    agent-max-steps: ${AWS_BEDROCK_AGENT_MAX_STEPS:10}            # model calls per request; the last one writes the answer
    agent-max-tokens: ${AWS_BEDROCK_AGENT_MAX_TOKENS:4096}   # room for several drafted emails in one call
    agent-max-result-chars: ${AWS_BEDROCK_AGENT_MAX_RESULT_CHARS:20000}   # size of one tool result sent back to the model
    # Credentials: default AWS chain (aws login / env vars / profile / IAM role).

# Emails the company assistant drafts: a person approves each batch before anything is sent.
assistant:
  email:
    max-recipients: ${ASSISTANT_EMAIL_MAX_RECIPIENTS:25}      # per batch
    batch-ttl-hours: ${ASSISTANT_EMAIL_BATCH_TTL_HOURS:24}    # approval is refused after this
  review:
    max-rounds: ${ASSISTANT_REVIEW_MAX_ROUNDS:2}      # reviewer calls per request
  session:
    ttl-hours: ${ASSISTANT_SESSION_TTL_HOURS:24}      # a session expires after this long without use
    max-turns: ${ASSISTANT_SESSION_MAX_TURNS:10}      # prompt/answer pairs replayed to the model
