spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:customer_app}

  flyway:
    schemas: ${DB_SCHEMA:customer_app}

aws:
  bedrock:
    # AI21 Jamba 1.5 Mini. The default in application.yml is unchanged; AWS_BEDROCK_MODEL_ID overrides this.
    model-id: ${AWS_BEDROCK_MODEL_ID:ai21.jamba-1-5-mini-v1:0}
