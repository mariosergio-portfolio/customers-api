spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?currentSchema=customer_app
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:customer_app}

  flyway:
    schemas: ${DB_SCHEMA:customer_app}
